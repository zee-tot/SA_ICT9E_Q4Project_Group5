<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>O.B. Montessori Center – Profile</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="logo.png" alt="OB Montessori Logo" class="logo-img"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'"/>
      <div class="logo-fallback">
        <span class="logo-tiger">🐯</span>
        <div class="logo-text">
          <span class="logo-main">East High</span>
          <span class="logo-since">Since 1913</span>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item" id="nav-dashboard">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </span>
        <span class="nav-label">Dashboard</span>
      </a>

      <a href="notebooks.html" class="nav-item" id="nav-notebook">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </span>
        <span class="nav-label">Virtual Notebook</span>
      </a>

      <a href="tasks.html" class="nav-item" id="nav-tasks">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="9" y1="13" x2="15" y2="13"/>
            <line x1="9" y1="17" x2="15" y2="17"/>
            <polyline points="9 9 10 9"/>
          </svg>
        </span>
        <span class="nav-label">Tasks</span>
      </a>

      <a href="profile.html" class="nav-item active" id="nav-profile">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </span>
        <span class="nav-label">Profile</span>
      </a>
    </nav>

    <button class="logout-btn" id="logoutBtn">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </span>
      <span class="nav-label">Log Out</span>
    </button>
  </aside>

  <!-- ── MAIN AREA ── -->
  <div class="main-wrap">

    <!-- Top Bar -->
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="page-title">Profile</h1>
      </div>
      <div class="topbar-right">
        <button class="topbar-icon" title="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </button>
        <button class="topbar-icon" title="Language">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
        </button>
        <div class="topbar-user">
          <span class="user-name"></span>
          <span class="user-role">Student</span>
        </div>
        <div class="user-avatar"></div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="content">
      <div class="profile-grid">

        <!-- Left: Photo + Name -->
        <div class="profile-card">
          <div class="avatar-wrap">
            <img id="avatarPhoto" class="avatar-photo" src="" alt="Profile Photo" />
            <div id="avatarInitials" class="avatar-initials"></div>
            <button class="avatar-upload-btn" id="avatarUploadBtn" title="Upload photo">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
              </svg>
            </button>
            <input type="file" id="avatarInput" accept="image/*" />
          </div>
          <div class="profile-name" id="profileName">—</div>
          <div class="profile-role">Student</div>
          <button class="change-pw-btn" id="changePwBtn">Change Password</button>
        </div>

        <!-- Right: Personal Info -->
        <div class="info-card" id="infoCard">
          <div class="info-card-header">
            <div class="info-card-title">Personal Information</div>
            <button class="edit-btn" id="editBtn">Edit</button>
            <button class="save-btn" id="saveBtn">Save Changes</button>
          </div>

          <div class="info-fields">

            <div class="info-field">
              <label>Student Name</label>
              <div class="field-value" id="val-name">—</div>
              <input class="field-input" id="inp-name" type="text" readonly placeholder="Auto-filled from login" />
            </div>

            <div class="info-field">
              <label>Student ID</label>
              <div class="field-value" id="val-id">—</div>
              <input class="field-input" id="inp-id" type="text" placeholder="e.g. 102150596" />
            </div>

            <div class="info-field">
              <label>Contact Number</label>
              <div class="field-value empty" id="val-contact">Not set — click Edit to add</div>
              <input class="field-input" id="inp-contact" type="tel" placeholder="e.g. 09459773605" />
            </div>

            <div class="info-field">
              <label>Email Address</label>
              <div class="field-value empty" id="val-email">Not set — click Edit to add</div>
              <input class="field-input" id="inp-email" type="email" placeholder="e.g. you@email.com" />
            </div>

            <div class="info-field">
              <label>Gender</label>
              <div class="field-value empty" id="val-gender">Not set — click Edit to add</div>
              <select class="field-input" id="inp-gender">
                <option value="">Select gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Prefer not to say">Prefer not to say</option>
              </select>
            </div>

            <div class="info-field">
              <label>Section</label>
              <div class="field-value empty" id="val-section">Not set — click Edit to add</div>
              <input class="field-input" id="inp-section" type="text" placeholder="e.g. 9-Emerald" />
            </div>

          </div>
        </div>

      </div>
    </main>

    <footer class="page-footer" id="pageFooter">
      <span class="footer-logo-mark">🐯</span>
      Group 5 &ndash; 9 Emerald &copy;2026
    </footer>

  </div>

  <!-- ── Change Password Modal ── -->
  <div class="modal-overlay" id="pwModal">
    <div class="modal">
      <div class="modal-title">Change Password</div>

      <div class="modal-field">
        <label>Current Password</label>
        <div class="modal-input-wrap">
          <input type="password" id="pwCurrent" placeholder="Enter current password" />
          <button class="modal-eye" data-target="pwCurrent">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <span class="modal-error" id="err-current"></span>
      </div>

      <div class="modal-field">
        <label>New Password</label>
        <div class="modal-input-wrap">
          <input type="password" id="pwNew" placeholder="At least 6 characters" />
          <button class="modal-eye" data-target="pwNew">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <span class="modal-error" id="err-new"></span>
      </div>

      <div class="modal-field">
        <label>Confirm New Password</label>
        <div class="modal-input-wrap">
          <input type="password" id="pwConfirm" placeholder="Repeat new password" />
          <button class="modal-eye" data-target="pwConfirm">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <span class="modal-error" id="err-confirm"></span>
      </div>

      <div class="modal-actions">
        <button class="modal-cancel" id="pwCancel">Cancel</button>
        <button class="modal-save" id="pwSave">Save Password</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="proj.js"></script>
</body>
</html>
